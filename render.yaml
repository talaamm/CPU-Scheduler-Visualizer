# Render Blueprint — deploys both services from this repo with one click.
# https://dashboard.render.com/blueprints -> New Blueprint Instance -> select this repo.
#
# Creates:
#   cpu-scheduler-api          Go REST API (simulation engine)
#   cpu-scheduler-visualizer   Vue 3 static frontend
#
# Both are on Render's free plan: no credit card, auto-deploys on every push
# to main. The free web service (the API) spins down after 15 minutes of
# inactivity and takes ~30-60s to wake back up on the next request — expected
# for a low-traffic portfolio demo, not a bug.
#
# The URLs below assume both service names are available on Render (they
# determine the https://<name>.onrender.com subdomain). If Render assigns
# different names, update ALLOWED_ORIGINS and VITE_API_URL in the dashboard
# to match — both services redeploy automatically when an env var changes.

services:
  - type: web
    name: cpu-scheduler-api
    runtime: go
    buildCommand: go build -o bin/server ./backend/cmd/server
    startCommand: ./bin/server
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://cpu-scheduler-visualizer.onrender.com

  - type: web
    name: cpu-scheduler-visualizer
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cpu-scheduler-api.onrender.com
