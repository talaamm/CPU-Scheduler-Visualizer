# Render Blueprint — deploys both services from this repo with one click.
# https://dashboard.render.com/blueprints -> New Blueprint Instance -> select this repo.
#
# Live:
#   https://cpu-scheduler-api.onrender.com                Go REST API
#   https://cpu-scheduler-visualizer-kce3.onrender.com     Vue 3 static frontend
#   (the frontend got a "-kce3" suffix because the plain name was taken —
#   ALLOWED_ORIGINS below must match whatever suffix Render actually assigns)
#
# Both are on Render's free plan: no credit card, auto-deploys on every push
# to main. The free web service (the API) spins down after 15 minutes of
# inactivity and takes ~30-60s to wake back up on the next request — expected
# for a low-traffic portfolio demo, not a bug.
#
# If either service is ever recreated under a different name/suffix, update
# ALLOWED_ORIGINS (backend) and VITE_API_URL (frontend) below to match —
# both services redeploy automatically when this file changes.

services:
  - type: web
    name: cpu-scheduler-api
    runtime: go
    plan: free
    buildCommand: go build -o bin/server ./backend/cmd/server
    startCommand: ./bin/server
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://cpu-scheduler-visualizer-kce3.onrender.com

  - type: web
    name: cpu-scheduler-visualizer
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://cpu-scheduler-api.onrender.com
